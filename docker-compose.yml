# Two ways to run the project with Docker:
#
#   docker compose up app        -> builds the warehouse and serves the
#                                   dashboard at http://localhost:8501
#   docker compose up airflow    -> Airflow (standalone) with the DAG mounted,
#                                   UI at http://localhost:8080 (admin/admin)
#
services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data

  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      - app
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      ECL_HOME: /opt/airflow/project
      PYTHONPATH: /opt/airflow/project:/opt/airflow/project/src
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      _PIP_ADDITIONAL_REQUIREMENTS: "duckdb>=1.1 dbt-core>=1.10.5 dbt-duckdb>=1.10 pyspark==3.5.3 pandas>=2.1 pyarrow>=14.0"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    ports:
      - "8080:8080"
    command: standalone

[project]
name = "equine-commerce-lakehouse"
version = "0.1.0"
description = "Multi-marketplace ELT / lakehouse: extract -> land -> clean (PySpark) -> model (dbt) -> validate -> serve."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "pipelines", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
